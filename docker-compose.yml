services:
  # Servicio de Base de Datos (SQL Server 2022)
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tutorias_db
    user: root
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=TutoriaDb#1
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data

  # Servicio de la Aplicación .NET 8
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tutorias_web
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=tutorias_db,1433;Database=TutoriasDb;User Id=sa;Password=TutoriaDb#1;TrustServerCertificate=True;MultipleActiveResultSets=true
    depends_on:
      - db

volumes:
  mssql_data:
